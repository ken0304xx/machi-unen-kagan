<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <title>サウンドノベル 街 雲煙過眼</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        html {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
            background-color: #050505;
            color: #ffffff;
            font-family: "Hiragino Kaku Gothic ProN", "Meiryo", sans-serif;
        }
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100dvh;
            background-color: #050505;
            color: #ffffff;
            font-family: "Hiragino Kaku Gothic ProN", "Meiryo", sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
        }

        #scroll-spacer {
            position: fixed;
            top: 0;
            left: 0;
            width: 1px;
            height: calc(100dvh + 120px);
            pointer-events: none;
            z-index: 0;
        }

        /* 40秒かけて等速（linear）で100px移動し、最後の位置で停止するアニメーション */
        @keyframes bgPanLinear {
            0% {
                transform: translateX(0px);
            }
            100% {
                transform: translateX(-100px);
            }
        }

        @keyframes pageTurnBlink {
            0%, 100% {
                opacity: 1;
            }
            50% {
                opacity: 0.35;
            }
        }

        #layout-wrapper {
            position: relative;
            z-index: 2;
            width: 100vw;
            height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 8px;
        }

        /* 16:9 ステージ（背景と本文のみを配置） */
        #stage {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #050505;
            flex-shrink: 1;
        }

        @media (orientation: landscape) {
            #stage {
                width: min(86vw, calc(100dvh * 16 / 9));
                height: min(100dvh, calc(86vw * 9 / 16));
                box-shadow: 0 0 40px rgba(0, 0, 0, 0.9);
            }
        }

        #bg-container {
            position: absolute;
            top: 0;
            left: 0;
            width: calc(100% + 120px);
            height: 100%;
            z-index: 1;
            opacity: 1;
            background-size: cover;
            background-position: center;
            transition: background 0.6s ease, opacity 0.6s ease;
            will-change: transform, opacity;
        }
        #bg-container.bg-fade-out {
            opacity: 0 !important;
        }
        #bg-container.panning {
            animation: bgPanLinear 40s linear forwards;
        }
        #bg-container.no-scroll-fit {
            width: 100%;
            height: 100%;
            transform: none !important;
            animation: none !important;
            background-size: 100% 100% !important;
            background-repeat: no-repeat;
            background-position: center;
        }

        #bg-video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
        }
        #bg-container.no-scroll-fit #bg-video {
            object-fit: contain;
        }

        #bg-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.25);
            z-index: 2;
        }

        #app {
            position: relative;
            z-index: 3;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            padding: 18px 24px;
        }

        #text-screen {
            flex: 1;
            width: 100%;
            max-width: 950px;
            margin: 0 auto;
            overflow-y: hidden;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
        }

        #story-text {
            font-size: clamp(24px, 4.4vh, 44px);
            line-height: 1.35;
            letter-spacing: 0.04em;
            white-space: pre-wrap;
            text-shadow: 
                3px 3px 4px #000,
                -2px -2px 3px #000,
                2px -2px 3px #000,
                -2px 2px 3px #000;
        }

        .page-turn-icon {
            display: inline-block;
            margin-left: 0.25em;
            color: #ffd54f;
            font-size: 0.72em;
            vertical-align: baseline;
            animation: pageTurnBlink 1.1s ease-in-out infinite;
        }

        .tips-word {
            color: #9ff2ff;
            font-weight: bold;
            border-bottom: none;
            text-decoration: none;
            cursor: pointer;
            padding: 0 2px;
        }
        .tips-word:active {
            background: rgba(161, 228, 168, 0.25);
        }

        /* ステージ外の左右に配置するナビゲーションボタン */
        .side-nav-btn {
            background: rgba(15, 18, 24, 0.9);
            color: #fff;
            border: 2px solid rgba(255, 255, 255, 0.4);
            padding: 18px 10px;
            font-size: 14px;
            font-weight: bold;
            writing-mode: vertical-rl;
            text-orientation: upright;
            letter-spacing: 0.15em;
            cursor: pointer;
            flex-shrink: 0;
            height: min(65%, 360px);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .side-nav-btn:active {
            background: rgba(255, 255, 255, 0.3);
        }
        .side-nav-btn:disabled {
            opacity: 0.25;
            cursor: default;
        }

        /* 暗転＋薄緑文字のTIPS表示（#stage内に収め、#app/#text-screenと同じ幅・余白・上詰め） */
        #tips-modal {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.78);
            z-index: 10;
            flex-direction: column;
            align-items: flex-start;
            justify-content: flex-start;
            padding: 18px 24px;
            overflow-y: auto;
            cursor: pointer;
        }
        #tips-card {
            background: transparent;
            border: none;
            box-shadow: none;
            width: 100%;
            max-width: 950px;
            margin: 0 auto;
            padding: 0;
        }
        #tips-title {
            font-size: clamp(24px, 4.4vh, 44px);
            font-weight: bold;
            color: #9ff2ff;
            line-height: 1.35;
            letter-spacing: 0.04em;
            margin-bottom: 10px;
            border-bottom: none;
            padding-bottom: 0;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.95);
        }
        #tips-body {
            font-size: clamp(24px, 4.4vh, 44px);
            font-weight: bold;
            line-height: 1.35;
            letter-spacing: 0.04em;
            color: #9ff2ff;
            margin-bottom: 0;
            white-space: pre-wrap;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.95);
        }
        #tips-close {
            display: none;
        }
    </style>
</head>
<body>
    <div id="scroll-spacer"></div>

    <div id="layout-wrapper">
        <button class="side-nav-btn" id="prev-btn" onclick="prevPage()">戻る</button>

        <div id="stage">
            <div id="bg-container">
                <video id="bg-video" autoplay muted playsinline></video>
            </div>
            <div id="bg-overlay"></div>
            <audio id="bgm-player" loop></audio>

            <div id="app">
                <div id="text-screen">
                    <div id="story-text"></div>
                </div>
            </div>

            <div id="tips-modal" onclick="closeTips()">
                <div id="tips-card" onclick="event.stopPropagation()">
                    <div id="tips-title"></div>
                    <div id="tips-body"></div>
                    <button id="tips-close" onclick="closeTips()">閉じる</button>
                </div>
            </div>
        </div>

        <button class="side-nav-btn" id="next-btn">進む</button>
    </div>

    <script src="./scenario2.js"></script>
    <script>
        let displayPages = [];
        let currentDisplayPageIndex = 0;
        let visibleChunkCount = 1;

        const isSoundOn = true;
        let currentBgmSrc = "";

        let lastBgType = "";
        let lastBgValue = "";

        // BGMタグの重複発火防止用管理（キー: `${pageIndex}:${chunkIndex}`）
        const triggeredBgmChunkKeys = new Set();

        const bgContainer = document.getElementById("bg-container");
        const bgVideo = document.getElementById("bg-video");
        bgVideo.loop = false;
        bgVideo.addEventListener("ended", () => {
            if (!Number.isNaN(bgVideo.duration) && isFinite(bgVideo.duration) && bgVideo.duration > 0) {
                bgVideo.currentTime = Math.max(0, bgVideo.duration - 0.001);
            }
            bgVideo.pause();
        });
        const bgmPlayer = document.getElementById("bgm-player");
        bgmPlayer.loop = true;
        bgmPlayer.volume = 1.0;

        const appEl = document.getElementById("app");
        const textScreenEl = document.getElementById("text-screen");
        const storyTextEl = document.getElementById("story-text");
        const prevBtn = document.getElementById("prev-btn");
        const nextBtn = document.getElementById("next-btn");
        const tipsModalEl = document.getElementById("tips-modal");

        function isTipsOpen() {
            return tipsModalEl.style.display === "flex";
        }

        const BGM_FADE_OUT_MS = 600;
        const BGM_FADE_STEP_MS = 30;
        let bgmFadeTimer = null;
        let pendingBgmTransitionId = 0;

        function clearBgmFadeTimer() {
            if (bgmFadeTimer !== null) {
                clearInterval(bgmFadeTimer);
                bgmFadeTimer = null;
            }
        }

        function startNewBgmImmediate(targetSrc, transitionId) {
            if (!isSoundOn) return;
            if (transitionId !== pendingBgmTransitionId) return;

            currentBgmSrc = targetSrc;
            bgmPlayer.pause();
            bgmPlayer.loop = true;
            bgmPlayer.src = currentBgmSrc;
            bgmPlayer.currentTime = 0;
            bgmPlayer.volume = 1.0;
            bgmPlayer.play().catch(() => {});
        }

        function stopBgmImmediate(transitionId) {
            if (transitionId !== pendingBgmTransitionId) return;
            currentBgmSrc = "";
            bgmPlayer.pause();
            bgmPlayer.removeAttribute("src");
            bgmPlayer.volume = 1.0;
        }

        function fadeOutAndSwitchBgm(targetSrc) {
            const transitionId = ++pendingBgmTransitionId;
            clearBgmFadeTimer();

            const canFadeCurrent =
                currentBgmSrc !== "" &&
                !bgmPlayer.paused &&
                bgmPlayer.volume > 0.01;

            if (!canFadeCurrent) {
                if (!targetSrc) {
                    stopBgmImmediate(transitionId);
                } else {
                    startNewBgmImmediate(targetSrc, transitionId);
                }
                return;
            }

            const startVolume = bgmPlayer.volume;
            const totalSteps = Math.max(1, Math.round(BGM_FADE_OUT_MS / BGM_FADE_STEP_MS));
            let step = 0;

            bgmFadeTimer = setInterval(() => {
                if (transitionId !== pendingBgmTransitionId) {
                    clearBgmFadeTimer();
                    return;
                }
                step++;
                const ratio = Math.max(0, 1 - step / totalSteps);
                bgmPlayer.volume = startVolume * ratio;

                if (step >= totalSteps) {
                    clearBgmFadeTimer();
                    if (!targetSrc) {
                        stopBgmImmediate(transitionId);
                    } else {
                        startNewBgmImmediate(targetSrc, transitionId);
                    }
                }
            }, BGM_FADE_STEP_MS);
        }

        function setBgmSource(targetSrc, { forceRestart = false } = {}) {
            if (!isSoundOn) return;

            if (!targetSrc) {
                if (currentBgmSrc !== "" || !bgmPlayer.paused) {
                    fadeOutAndSwitchBgm("");
                } else {
                    pendingBgmTransitionId++;
                    clearBgmFadeTimer();
                    currentBgmSrc = "";
                }
                return;
            }

            if (targetSrc === currentBgmSrc && !forceRestart) {
                if (bgmFadeTimer !== null) {
                    pendingBgmTransitionId++;
                    clearBgmFadeTimer();
                    bgmPlayer.volume = 1.0;
                }
                ensureBgmPlaying();
                return;
            }

            if (targetSrc === currentBgmSrc && forceRestart) {
                pendingBgmTransitionId++;
                clearBgmFadeTimer();
                startNewBgmImmediate(targetSrc, pendingBgmTransitionId);
                return;
            }

            fadeOutAndSwitchBgm(targetSrc);
        }

        function ensureBgmPlaying() {
            if (!isSoundOn || !currentBgmSrc) return;
            if (bgmFadeTimer === null) {
                bgmPlayer.volume = 1.0;
            }
            if (bgmPlayer.paused) {
                bgmPlayer.play().catch(() => {});
            }
        }

        const activeSeBySrc = new Map();

        function playSe(seName) {
            if (!isSoundOn || !seName) return;
            const dict = (typeof SE_DICT !== "undefined") ? SE_DICT : {};
            const src = dict[seName] || seName;
            if (!src) return;

            // 同一音源が再生終了済み（または停止中）なら先頭から再生し、再生中なら重ね再生する
            const existing = activeSeBySrc.get(src);
            if (existing && existing.ended) {
                existing.currentTime = 0;
                existing.volume = 1.0;
                existing.play().catch(() => {});
                return;
            }

            const seAudio = new Audio(src);
            seAudio.loop = false;
            seAudio.volume = 1.0;
            activeSeBySrc.set(src, seAudio);
            seAudio.addEventListener("ended", () => {
                seAudio.currentTime = 0;
            });
            seAudio.play().catch(() => {});
        }

        function applyBgmTag(bgmName) {
            if (!isSoundOn) return;
            const trimmed = (bgmName || "").trim();

            if (!trimmed) {
                setBgmSource("", { forceRestart: true });
                return;
            }

            const dict = (typeof BGM_DICT !== "undefined") ? BGM_DICT : {};
            const src = dict[trimmed] || trimmed;
            if (!src) return;

            setBgmSource(src, { forceRestart: true });
        }

        function extractAudioTags(rawText) {
            const tags = [];
            if (!rawText) return tags;

            const regex = /<(se(?:\s+[^>]+)?|bgm(?:\s+[^>]*)?)>/gi;
            let match;
            while ((match = regex.exec(rawText)) !== null) {
                const inner = match[1].trim();
                if (/^se\b/i.test(inner)) {
                    const name = inner.replace(/^se\s*/i, "").trim();
                    if (name) {
                        tags.push({ type: "se", name });
                    }
                } else if (/^bgm\b/i.test(inner)) {
                    const name = inner.replace(/^bgm\s*/i, "").trim();
                    if (name) {
                        tags.push({ type: "bgm", name });
                    }
                }
            }
            return tags;
        }

        function stripAudioTags(rawText) {
            if (!rawText) return "";
            return rawText.replace(/<(se(?:\s+[^>]+)?|bgm(?:\s+[^>]*)?)>/gi, "");
        }

        function executeTagsInChunk(rawChunkText, { allowBgm = true } = {}) {
            const tags = extractAudioTags(rawChunkText);
            if (tags.length === 0) return;

            // SEは到達・再到達のたびに再生（再生終了済みなら先頭から、再生中なら重ねて再生）
            // BGMは同時再生可能かつ重複発火を抑止
            tags.forEach((tag) => {
                if (tag.type === "se") {
                    playSe(tag.name);
                } else if (tag.type === "bgm" && allowBgm) {
                    applyBgmTag(tag.name);
                }
            });
        }

        function triggerNewlyVisibleChunks(pageIndex, fromCount, toCount, { allowBgm = true } = {}) {
            const page = displayPages[pageIndex];
            if (!page) return;

            for (let idx = fromCount; idx < toCount; idx++) {
                const key = `${pageIndex}:${idx}`;
                const shouldRunBgm = allowBgm && !triggeredBgmChunkKeys.has(key);
                if (shouldRunBgm) {
                    triggeredBgmChunkKeys.add(key);
                }
                executeTagsInChunk(page.chunks[idx] || "", { allowBgm: shouldRunBgm });
            }
        }

        function nudgeAddressBar() {
            requestAnimationFrame(() => {
                if (window.scrollY < 40) {
                    window.scrollTo(0, 40);
                }
            });
        }

        function formatTipsHtml(rawText) {
            const cleanText = stripAudioTags(rawText);
            return cleanText.replace(/\[\[(.*?)(?:\|(.*?))?\]\]/g, (match, key, label) => {
                const displayLabel = label || key;
                return `<span class="tips-word" onclick="openTips('${key}')">${displayLabel}</span>`;
            });
        }

        function appendPageTurnIconToText(rawText) {
            const cleanText = stripAudioTags(rawText);
            const iconHtml = `<span class="page-turn-icon" aria-hidden="true">📄</span>`;
            const trailingNewlinesMatch = cleanText.match(/\n+$/);
            if (trailingNewlinesMatch) {
                const head = cleanText.slice(0, cleanText.length - trailingNewlinesMatch[0].length);
                return `${formatTipsHtml(head)}${iconHtml}${trailingNewlinesMatch[0]}`;
            }
            return `${formatTipsHtml(cleanText)}${iconHtml}`;
        }

        function splitTextIntoChunks(rawText) {
            if (!rawText) return [];

            const chunks = [];
            let start = 0;
            let i = 0;

            while (i < rawText.length) {
                if (rawText[i] === "\n") {
                    const end = i + 1;
                    const piece = rawText.slice(start, end);
                    if (
                        piece.replace(/<(?:se(?:\s+[^>]+)?|bgm(?:\s+[^>]*)?)>/gi, "").replace(/\s+/g, "").length > 0 ||
                        extractAudioTags(piece).length > 0
                    ) {
                        chunks.push(piece);
                    }
                    start = end;
                }
                i++;
            }

            if (start < rawText.length) {
                const tail = rawText.slice(start);
                if (
                    tail.replace(/<(?:se(?:\s+[^>]+)?|bgm(?:\s+[^>]*)?)>/gi, "").replace(/\s+/g, "").length > 0 ||
                    extractAudioTags(tail).length > 0
                ) {
                    chunks.push(tail);
                }
            }

            return chunks.length > 0 ? chunks : [rawText];
        }

        function rebuildDisplayPages(preserveSceneIndex = 0) {
            const prevHtml = storyTextEl.innerHTML;
            const prevOverflowY = textScreenEl.style.overflowY;
            textScreenEl.style.overflowY = "hidden";

            const pages = [];

            SCENARIO.forEach((scene, sceneIndex) => {
                const allChunks = splitTextIntoChunks(scene.text || "");
                const buckets = [];
                let currentBucket = [];

                allChunks.forEach((chunk) => {
                    const candidateChunks = currentBucket.concat(chunk);
                    storyTextEl.innerHTML = formatTipsHtml(candidateChunks.join(""));

                    if (currentBucket.length > 0 && textScreenEl.scrollHeight > textScreenEl.clientHeight) {
                        buckets.push(currentBucket);
                        currentBucket = [chunk];
                    } else {
                        currentBucket = candidateChunks;
                    }
                });

                if (currentBucket.length > 0) {
                    buckets.push(currentBucket);
                }

                const totalSubPages = buckets.length || 1;
                for (let s = 0; s < totalSubPages; s++) {
                    pages.push({
                        sceneIndex,
                        subPageIndex: s,
                        totalSubPages,
                        chunks: buckets[s] || []
                    });
                }
            });

            storyTextEl.innerHTML = prevHtml;
            textScreenEl.style.overflowY = prevOverflowY;

            displayPages = pages;
            triggeredBgmChunkKeys.clear();

            const targetIndex = displayPages.findIndex(p => p.sceneIndex === preserveSceneIndex);
            currentDisplayPageIndex = targetIndex >= 0 ? targetIndex : 0;
            visibleChunkCount = 1;
        }

        function isScrollDisabled(scene) {
            return Boolean(scene && scene.scroll === "none");
        }

        function applyNoScrollFitMode(scene) {
            if (isScrollDisabled(scene)) {
                bgContainer.classList.add("no-scroll-fit");
                bgContainer.classList.remove("panning");
                bgContainer.style.transform = "";
            } else {
                bgContainer.classList.remove("no-scroll-fit");
            }
        }

        function stopPanAnimation() {
            bgContainer.classList.remove("panning");
            bgContainer.style.transform = "translateX(0px)";
        }

        function restartPanAnimation(scene = null) {
            if (isScrollDisabled(scene)) {
                applyNoScrollFitMode(scene);
                return;
            }
            bgContainer.classList.remove("no-scroll-fit");
            bgContainer.style.transform = "";
            bgContainer.classList.remove("panning");
            void bgContainer.offsetWidth;
            bgContainer.classList.add("panning");
        }

        function renderCurrentChunks() {
            const page = displayPages[currentDisplayPageIndex];
            if (!page) return;
            const activeText = page.chunks.slice(0, visibleChunkCount).join("");

            const isAutoPageTurnPoint =
                visibleChunkCount === page.chunks.length &&
                currentDisplayPageIndex < displayPages.length - 1;

            if (isAutoPageTurnPoint) {
                storyTextEl.innerHTML = appendPageTurnIconToText(activeText);
            } else {
                storyTextEl.innerHTML = formatTipsHtml(activeText);
            }
        }

        function isMovieBgType(bgType) {
            return bgType === "movie" || bgType === "video";
        }

        function resetBgFadeOut() {
            bgContainer.classList.remove("bg-fade-out");
            bgContainer.style.opacity = "1";
        }

        function applySceneMedia(scene, { restoreSceneBgm = false } = {}) {
            resetBgFadeOut();
            const isSameBg = (scene.bgType === lastBgType && scene.bgValue === lastBgValue);
            const noScroll = isScrollDisabled(scene);
            const isMovie = isMovieBgType(scene.bgType);
            applyNoScrollFitMode(scene);

            if (!isSameBg) {
                if (isMovie && scene.bgValue) {
                    bgContainer.style.backgroundImage = "none";
                    bgContainer.style.background = "#000";
                    bgVideo.loop = false;
                    if (bgVideo.getAttribute("src") !== scene.bgValue) {
                        bgVideo.src = scene.bgValue;
                        bgVideo.load();
                    }
                    bgVideo.style.display = "block";
                    bgVideo.currentTime = 0;
                    bgVideo.play().catch(() => {});
                    restartPanAnimation(scene);
                } else if (scene.bgType === "image" && scene.bgValue) {
                    bgVideo.style.display = "none";
                    bgVideo.pause();
                    bgContainer.style.background = noScroll ? "#050505" : "";
                    bgContainer.style.backgroundImage = `url('${scene.bgValue}')`;
                    restartPanAnimation(scene);
                } else {
                    bgVideo.style.display = "none";
                    bgVideo.pause();
                    stopPanAnimation();
                    bgContainer.style.backgroundImage = "none";
                    bgContainer.style.background = scene.bgValue || "#0b0b0b";
                }

                lastBgType = scene.bgType;
                lastBgValue = scene.bgValue;
            } else if (isMovie || scene.bgType === "image") {
                if (isMovie && scene.bgValue) {
                    bgVideo.style.display = "block";
                    bgVideo.play().catch(() => {});
                } else if (scene.bgType === "image" && scene.bgValue) {
                    bgContainer.style.background = noScroll ? "#050505" : "";
                    bgContainer.style.backgroundImage = `url('${scene.bgValue}')`;
                }
                if (noScroll) {
                    applyNoScrollFitMode(scene);
                } else if (!bgContainer.classList.contains("panning")) {
                    restartPanAnimation(scene);
                }
            }

            const targetBgm = scene.bgm || "";
            if (restoreSceneBgm) {
                // 「戻る」操作時: 現在再生中がSCENARIO定義と異なれば最初から再生、同じなら継続
                if (targetBgm !== currentBgmSrc) {
                    setBgmSource(targetBgm, { forceRestart: true });
                } else if (currentBgmSrc) {
                    ensureBgmPlaying();
                }
            } else if (targetBgm !== currentBgmSrc) {
                setBgmSource(targetBgm, { forceRestart: false });
            } else if (currentBgmSrc) {
                ensureBgmPlaying();
            }
        }

        function loadDisplayPage(pageIndex, startAtFirstChunk = true, { fromBack = false } = {}) {
            if (pageIndex < 0 || pageIndex >= displayPages.length) return;
            currentDisplayPageIndex = pageIndex;

            const page = displayPages[currentDisplayPageIndex];
            const scene = SCENARIO[page.sceneIndex];

            visibleChunkCount = startAtFirstChunk ? 1 : page.chunks.length;

            renderCurrentChunks();
            applySceneMedia(scene, { restoreSceneBgm: fromBack });

            if (!fromBack) {
                triggerNewlyVisibleChunks(currentDisplayPageIndex, 0, visibleChunkCount, { allowBgm: true });
            } else {
                // 「戻る」操作時はSCENARIO定義BGMを基準とするためタグ由来のBGM上書きは抑止し、SEのみ再生
                triggeredBgmChunkKeys.add(`${currentDisplayPageIndex}:0`);
                triggerNewlyVisibleChunks(currentDisplayPageIndex, 0, visibleChunkCount, { allowBgm: false });
            }

            updateNavButtons();
        }

        function updateNavButtons() {
            const page = displayPages[currentDisplayPageIndex];
            const isAtVeryStart = (currentDisplayPageIndex === 0 && visibleChunkCount <= 1);
            const isAtVeryEnd = (currentDisplayPageIndex === displayPages.length - 1 && visibleChunkCount >= (page ? page.chunks.length : 1));

            prevBtn.disabled = isAtVeryStart;
            nextBtn.disabled = isTipsOpen() ? false : isAtVeryEnd;
        }

        const BG_FADE_OUT_MS = 600;
        let bgFadeOutTimer = null;
        let isBgFadingOut = false;

        function clearBgFadeOutTimer() {
            if (bgFadeOutTimer !== null) {
                clearTimeout(bgFadeOutTimer);
                bgFadeOutTimer = null;
            }
            isBgFadingOut = false;
        }

        function executeNextPageStep() {
            const page = displayPages[currentDisplayPageIndex];
            if (!page) return;

            if (visibleChunkCount < page.chunks.length) {
                const prevCount = visibleChunkCount;
                visibleChunkCount++;
                renderCurrentChunks();
                triggerNewlyVisibleChunks(currentDisplayPageIndex, prevCount, visibleChunkCount);
                updateNavButtons();
            } else if (currentDisplayPageIndex < displayPages.length - 1) {
                loadDisplayPage(currentDisplayPageIndex + 1, true, { fromBack: false });
            }
        }

        function nextPage() {
            nudgeAddressBar();
            ensureBgmPlaying();

            if (isTipsOpen()) {
                closeTips();
                return;
            }

            if (isBgFadingOut) return;

            const page = displayPages[currentDisplayPageIndex];
            if (!page) return;

            const isAtPageEnd = visibleChunkCount >= page.chunks.length;
            const hasNextDisplayPage = currentDisplayPageIndex < displayPages.length - 1;
            const scene = SCENARIO[page.sceneIndex];

            if (isAtPageEnd && hasNextDisplayPage && scene && scene.bgFadeOut === true) {
                isBgFadingOut = true;
                prevBtn.disabled = true;
                nextBtn.disabled = true;
                bgContainer.classList.add("bg-fade-out");
                bgContainer.style.opacity = "0";

                bgFadeOutTimer = setTimeout(() => {
                    bgFadeOutTimer = null;
                    isBgFadingOut = false;
                    loadDisplayPage(currentDisplayPageIndex + 1, true, { fromBack: false });
                }, BG_FADE_OUT_MS);
                return;
            }

            executeNextPageStep();
        }

        function prevPage() {
            nudgeAddressBar();
            ensureBgmPlaying();

            clearBgFadeOutTimer();
            resetBgFadeOut();

            if (isTipsOpen()) {
                closeTips();
                return;
            }

            if (currentDisplayPageIndex > 0) {
                loadDisplayPage(currentDisplayPageIndex - 1, true, { fromBack: true });
            } else if (visibleChunkCount > 1) {
                visibleChunkCount = 1;
                renderCurrentChunks();
                const scene = SCENARIO[displayPages[currentDisplayPageIndex]?.sceneIndex];
                if (scene) {
                    const targetBgm = scene.bgm || "";
                    if (targetBgm !== currentBgmSrc) {
                        setBgmSource(targetBgm, { forceRestart: true });
                    } else if (currentBgmSrc) {
                        ensureBgmPlaying();
                    }
                }
                updateNavButtons();
            }
        }

        function formatQuotedTitle(rawTitle) {
            const trimmed = String(rawTitle || "").trim();
            if (!trimmed) return "";
            const hasLeading = trimmed.startsWith("「");
            const hasTrailing = trimmed.endsWith("」");
            if (hasLeading && hasTrailing) return trimmed;
            const inner = trimmed.replace(/^「|」$/g, "");
            return `「${inner}」`;
        }

        function openTips(word) {
            ensureBgmPlaying();
            const tip = TIPS_DICT[word];
            const titleEl = document.getElementById("tips-title");
            const bodyEl = document.getElementById("tips-body");

            if (tip) {
                titleEl.textContent = formatQuotedTitle(tip.title);
                bodyEl.textContent = tip.body;
            } else {
                titleEl.textContent = formatQuotedTitle(word);
                bodyEl.textContent = "（解説データ未登録）";
            }

            appEl.style.visibility = "hidden";
            tipsModalEl.style.display = "flex";
            tipsModalEl.scrollTop = 0;
            updateNavButtons();
        }

        function closeTips() {
            tipsModalEl.style.display = "none";
            appEl.style.visibility = "";
            updateNavButtons();
        }

        document.addEventListener("pointerdown", ensureBgmPlaying, { once: true });

        // 「進む」ボタン長押しによるSCENARIO単位の早送り制御
        const HOLD_DELAY_MS = 350;
        const FAST_FORWARD_INTERVAL_MS = 160;
        let holdStartTimer = null;
        let fastForwardTimer = null;
        let isFastForwarding = false;
        let suppressNextClick = false;

        function getNextScenarioPageIndex() {
            const currentPage = displayPages[currentDisplayPageIndex];
            if (!currentPage) return -1;
            const currentSceneIdx = currentPage.sceneIndex;
            return displayPages.findIndex(
                (p, idx) => idx > currentDisplayPageIndex && p.sceneIndex > currentSceneIdx
            );
        }

        function advanceToNextScenario() {
            nudgeAddressBar();
            ensureBgmPlaying();

            clearBgFadeOutTimer();
            resetBgFadeOut();

            if (isTipsOpen()) {
                closeTips();
                return true;
            }

            const targetPageIdx = getNextScenarioPageIndex();
            if (targetPageIdx >= 0) {
                loadDisplayPage(targetPageIdx, true, { fromBack: false });
                return true;
            }

            // 最後のSCENARIO内にいる場合は末尾チャンクまで進める
            const page = displayPages[currentDisplayPageIndex];
            if (page && visibleChunkCount < page.chunks.length) {
                const prevCount = visibleChunkCount;
                visibleChunkCount = page.chunks.length;
                renderCurrentChunks();
                triggerNewlyVisibleChunks(currentDisplayPageIndex, prevCount, visibleChunkCount, { allowBgm: true });
                updateNavButtons();
                return true;
            }
            return false;
        }

        function canAdvanceNext() {
            if (isTipsOpen()) return true;
            if (getNextScenarioPageIndex() >= 0) return true;
            const page = displayPages[currentDisplayPageIndex];
            if (!page) return false;
            const isAtVeryEnd = (
                currentDisplayPageIndex === displayPages.length - 1 &&
                visibleChunkCount >= page.chunks.length
            );
            return !isAtVeryEnd;
        }

        function clearFastForwardTimers() {
            if (holdStartTimer !== null) {
                clearTimeout(holdStartTimer);
                holdStartTimer = null;
            }
            if (fastForwardTimer !== null) {
                clearInterval(fastForwardTimer);
                fastForwardTimer = null;
            }
            isFastForwarding = false;
        }

        function startFastForwardLoop() {
            if (fastForwardTimer !== null) return;
            isFastForwarding = true;
            suppressNextClick = true;

            if (!advanceToNextScenario()) {
                stopFastForward();
                return;
            }

            fastForwardTimer = setInterval(() => {
                if (nextBtn.disabled || !canAdvanceNext()) {
                    stopFastForward();
                    return;
                }
                if (!advanceToNextScenario()) {
                    stopFastForward();
                }
            }, FAST_FORWARD_INTERVAL_MS);
        }

        function stopFastForward() {
            const wasFastForwarding = isFastForwarding;
            clearFastForwardTimers();
            if (wasFastForwarding) {
                setTimeout(() => {
                    suppressNextClick = false;
                }, 0);
            }
        }

        nextBtn.addEventListener("pointerdown", (e) => {
            if (e.button !== undefined && e.button !== 0) return;
            if (nextBtn.disabled || !canAdvanceNext()) return;

            suppressNextClick = false;
            clearFastForwardTimers();

            holdStartTimer = setTimeout(() => {
                if (!nextBtn.disabled && canAdvanceNext()) {
                    startFastForwardLoop();
                }
            }, HOLD_DELAY_MS);
        });

        nextBtn.addEventListener("click", (e) => {
            if (suppressNextClick) {
                e.preventDefault();
                suppressNextClick = false;
                return;
            }
            nextPage();
        });

        ["pointerup", "pointercancel", "pointerleave"].forEach((evName) => {
            nextBtn.addEventListener(evName, stopFastForward);
        });
        window.addEventListener("pointerup", stopFastForward);
        window.addEventListener("pointercancel", stopFastForward);
        window.addEventListener("blur", stopFastForward);

        window.addEventListener("load", () => {
            nudgeAddressBar();
            rebuildDisplayPages(0);
            loadDisplayPage(0, true);
        });

        window.addEventListener("orientationchange", () => {
            setTimeout(() => {
                nudgeAddressBar();
                const currentSceneIdx = displayPages[currentDisplayPageIndex]?.sceneIndex ?? 0;
                rebuildDisplayPages(currentSceneIdx);
                loadDisplayPage(currentDisplayPageIndex, true);
            }, 250);
        });

        window.addEventListener("resize", () => {
            nudgeAddressBar();
            const currentSceneIdx = displayPages[currentDisplayPageIndex]?.sceneIndex ?? 0;
            rebuildDisplayPages(currentSceneIdx);
            loadDisplayPage(currentDisplayPageIndex, true);
        });

        rebuildDisplayPages(0);
        loadDisplayPage(0, true);
    </script>
</body>
</html>
