<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <title>サウンドノベル 街 雲煙過眼</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        html {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
            background-color: #050505;
            color: #ffffff;
            font-family: "Hiragino Kaku Gothic ProN", "Meiryo", sans-serif;
        }
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100dvh;
            background-color: #050505;
            color: #ffffff;
            font-family: "Hiragino Kaku Gothic ProN", "Meiryo", sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
        }

        #scroll-spacer {
            position: fixed;
            top: 0;
            left: 0;
            width: 1px;
            height: calc(100dvh + 120px);
            pointer-events: none;
            z-index: 0;
        }

        /* 20秒かけて等速（linear）で100px移動し、最後の位置で停止するアニメーション */
        @keyframes bgPanLinear {
            0% {
                transform: translateX(0px);
            }
            100% {
                transform: translateX(-100px);
            }
        }

        @keyframes pageTurnBlink {
            0%, 100% {
                opacity: 1;
            }
            50% {
                opacity: 0.35;
            }
        }

        #layout-wrapper {
            position: relative;
            z-index: 2;
            width: 100vw;
            height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 8px;
        }

        /* 16:9 ステージ（背景と本文のみを配置） */
        #stage {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #050505;
            flex-shrink: 1;
        }

        @media (orientation: landscape) {
            #stage {
                width: min(86vw, calc(100dvh * 16 / 9));
                height: min(100dvh, calc(86vw * 9 / 16));
                box-shadow: 0 0 40px rgba(0, 0, 0, 0.9);
            }
        }

        #bg-container {
            position: absolute;
            top: 0;
            left: 0;
            width: calc(100% + 120px);
            height: 100%;
            z-index: 1;
            background-size: cover;
            background-position: center;
            transition: background 0.6s ease, opacity 0.6s ease;
            will-change: transform;
        }
        #bg-container.panning {
            animation: bgPanLinear 20s linear forwards;
        }

        #bg-video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
        }

        #bg-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.25);
            z-index: 2;
        }

        #app {
            position: relative;
            z-index: 3;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            padding: 18px 24px;
        }

        #text-screen {
            flex: 1;
            width: 100%;
            max-width: 950px;
            margin: 0 auto;
            overflow-y: hidden;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
        }

        #story-text {
            font-size: clamp(24px, 4.4vh, 44px);
            line-height: 1.35;
            letter-spacing: 0.04em;
            white-space: pre-wrap;
            text-shadow: 
                3px 3px 4px #000,
                -2px -2px 3px #000,
                2px -2px 3px #000,
                -2px 2px 3px #000;
        }

        .page-turn-icon {
            display: inline-block;
            margin-left: 0.25em;
            color: #ffd54f;
            font-size: 0.72em;
            vertical-align: baseline;
            animation: pageTurnBlink 1.1s ease-in-out infinite;
        }

        .tips-word {
            color: #9ff2ff;
            font-weight: bold;
            border-bottom: none;
            text-decoration: none;
            cursor: pointer;
            padding: 0 2px;
        }
        .tips-word:active {
            background: rgba(161, 228, 168, 0.25);
        }

        /* ステージ外の左右に配置するナビゲーションボタン */
        .side-nav-btn {
            background: rgba(15, 18, 24, 0.9);
            color: #fff;
            border: 2px solid rgba(255, 255, 255, 0.4);
            padding: 18px 10px;
            font-size: 14px;
            font-weight: bold;
            writing-mode: vertical-rl;
            text-orientation: upright;
            letter-spacing: 0.15em;
            cursor: pointer;
            flex-shrink: 0;
            height: min(65%, 360px);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .side-nav-btn:active {
            background: rgba(255, 255, 255, 0.3);
        }
        .side-nav-btn:disabled {
            opacity: 0.25;
            cursor: default;
        }

        /* 暗転＋薄緑文字のTIPS表示（上詰め） */
        #tips-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.78);
            z-index: 10;
            align-items: flex-start;
            justify-content: center;
            padding: 36px 28px 24px;
            overflow-y: auto;
            cursor: pointer;
        }
        #tips-card {
            background: transparent;
            border: none;
            box-shadow: none;
            width: 100%;
            max-width: 900px;
            padding: 8px 16px;
        }
        #tips-title {
            font-size: clamp(22px, 3.6vh, 36px);
            font-weight: bold;
            color: #9ff2ff;
            line-height: 1.45;
            letter-spacing: 0.04em;
            margin-bottom: 10px;
            border-bottom: none;
            padding-bottom: 0;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.95);
        }
        #tips-body {
            font-size: clamp(20px, 3.3vh, 34px);
            font-weight: bold;
            line-height: 1.5;
            letter-spacing: 0.04em;
            color: #9ff2ff;
            margin-bottom: 0;
            white-space: pre-wrap;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.95);
        }
        #tips-close {
            display: none;
        }
    </style>
</head>
<body>
    <div id="scroll-spacer"></div>

    <div id="layout-wrapper">
        <button class="side-nav-btn" id="prev-btn" onclick="prevPage()">戻る</button>

        <div id="stage">
            <div id="bg-container">
                <video id="bg-video" autoplay loop muted playsinline></video>
            </div>
            <div id="bg-overlay"></div>
            <audio id="bgm-player" loop></audio>

            <div id="app">
                <div id="text-screen">
                    <div id="story-text"></div>
                </div>
            </div>
        </div>

        <button class="side-nav-btn" id="next-btn" onclick="nextPage()">進む</button>
    </div>

    <div id="tips-modal" onclick="closeTips()">
        <div id="tips-card" onclick="event.stopPropagation()">
            <div id="tips-title"></div>
            <div id="tips-body"></div>
            <button id="tips-close" onclick="closeTips()">閉じる</button>
        </div>
    </div>

    <script src="./scenario.js"></script>
    <script>
        let displayPages = [];
        let currentDisplayPageIndex = 0;
        let visibleChunkCount = 1;

        const isSoundOn = true;
        let currentBgmSrc = "";

        let lastBgType = "";
        let lastBgValue = "";

        const bgContainer = document.getElementById("bg-container");
        const bgVideo = document.getElementById("bg-video");
        const bgmPlayer = document.getElementById("bgm-player");
        bgmPlayer.volume = 1.0;

        const appEl = document.getElementById("app");
        const textScreenEl = document.getElementById("text-screen");
        const storyTextEl = document.getElementById("story-text");
        const prevBtn = document.getElementById("prev-btn");
        const nextBtn = document.getElementById("next-btn");
        const tipsModalEl = document.getElementById("tips-modal");

        function isTipsOpen() {
            return tipsModalEl.style.display === "flex";
        }

        function ensureBgmPlaying() {
            if (!isSoundOn || !currentBgmSrc) return;
            bgmPlayer.volume = 1.0;
            if (bgmPlayer.paused) {
                bgmPlayer.play().catch(() => {});
            }
        }

        function nudgeAddressBar() {
            requestAnimationFrame(() => {
                if (window.scrollY < 40) {
                    window.scrollTo(0, 40);
                }
            });
        }

        function formatTipsHtml(rawText) {
            return rawText.replace(/\[\[(.*?)(?:\|(.*?))?\]\]/g, (match, key, label) => {
                const displayLabel = label || key;
                return `<span class="tips-word" onclick="openTips('${key}')">${displayLabel}</span>`;
            });
        }

        function appendPageTurnIconToText(rawText) {
            const iconHtml = `<span class="page-turn-icon" aria-hidden="true">\u{1F4C4}</span>`;
            const trailingNewlinesMatch = rawText.match(/\n+$/);
            if (trailingNewlinesMatch) {
                const head = rawText.slice(0, rawText.length - trailingNewlinesMatch[0].length);
                return `${formatTipsHtml(head)}${iconHtml}${trailingNewlinesMatch[0]}`;
            }
            return `${formatTipsHtml(rawText)}${iconHtml}`;
        }

        function splitTextIntoChunks(rawText) {
            if (!rawText) return [];

            const protectedRanges = [];
            const bracketRegex = /\[\[.*?\]\]/g;
            let bMatch;
            while ((bMatch = bracketRegex.exec(rawText)) !== null) {
                protectedRanges.push({
                    start: bMatch.index,
                    end: bMatch.index + bMatch[0].length
                });
            }

            function isProtected(idx) {
                return protectedRanges.some(r => idx >= r.start && idx < r.end);
            }

            const chunks = [];
            let start = 0;
            let i = 0;

            while (i < rawText.length) {
                if (!isProtected(i)) {
                    const ch = rawText[i];

                    if (ch === "。" || ch === "？" || ch === "！" || ch === "\n") {
                        let end = i + 1;

                        while (end < rawText.length && !isProtected(end)) {
                            const nextCh = rawText[end];
                            if (
                                nextCh === "。" ||
                                nextCh === "？" ||
                                nextCh === "！" ||
                                nextCh === "?" ||
                                nextCh === "!" ||
                                nextCh === "」" ||
                                nextCh === "』" ||
                                nextCh === "）"
                            ) {
                                end++;
                            } else {
                                break;
                            }
                        }

                        if (end < rawText.length && rawText[end] === "\n" && !isProtected(end)) {
                            end++;
                        }

                        const piece = rawText.slice(start, end);
                        if (piece.replace(/\s+/g, "").length > 0) {
                            chunks.push(piece);
                        }
                        start = end;
                        i = end;
                        continue;
                    }
                }
                i++;
            }

            if (start < rawText.length) {
                const tail = rawText.slice(start);
                if (tail.replace(/\s+/g, "").length > 0) {
                    chunks.push(tail);
                }
            }

            return chunks.length > 0 ? chunks : [rawText];
        }

        function rebuildDisplayPages(preserveSceneIndex = 0) {
            const prevHtml = storyTextEl.innerHTML;
            const prevOverflowY = textScreenEl.style.overflowY;
            textScreenEl.style.overflowY = "hidden";

            const pages = [];

            SCENARIO.forEach((scene, sceneIndex) => {
                const allChunks = splitTextIntoChunks(scene.text || "");
                const buckets = [];
                let currentBucket = [];

                allChunks.forEach((chunk) => {
                    const candidateChunks = currentBucket.concat(chunk);
                    storyTextEl.innerHTML = formatTipsHtml(candidateChunks.join(""));

                    if (currentBucket.length > 0 && textScreenEl.scrollHeight > textScreenEl.clientHeight) {
                        buckets.push(currentBucket);
                        currentBucket = [chunk];
                    } else {
                        currentBucket = candidateChunks;
                    }
                });

                if (currentBucket.length > 0) {
                    buckets.push(currentBucket);
                }

                const totalSubPages = buckets.length || 1;
                for (let s = 0; s < totalSubPages; s++) {
                    pages.push({
                        sceneIndex,
                        subPageIndex: s,
                        totalSubPages,
                        chunks: buckets[s] || []
                    });
                }
            });

            storyTextEl.innerHTML = prevHtml;
            textScreenEl.style.overflowY = prevOverflowY;

            displayPages = pages;

            const targetIndex = displayPages.findIndex(p => p.sceneIndex === preserveSceneIndex);
            currentDisplayPageIndex = targetIndex >= 0 ? targetIndex : 0;
            visibleChunkCount = 1;
        }

        function restartPanAnimation() {
            bgContainer.classList.remove("panning");
            void bgContainer.offsetWidth;
            bgContainer.classList.add("panning");
        }

        function renderCurrentChunks() {
            const page = displayPages[currentDisplayPageIndex];
            if (!page) return;
            const activeText = page.chunks.slice(0, visibleChunkCount).join("");

            const isAutoPageTurnPoint =
                page.totalSubPages > 1 &&
                visibleChunkCount === page.chunks.length &&
                currentDisplayPageIndex < displayPages.length - 1;

            if (isAutoPageTurnPoint) {
                storyTextEl.innerHTML = appendPageTurnIconToText(activeText);
            } else {
                storyTextEl.innerHTML = formatTipsHtml(activeText);
            }
        }

        function applySceneMedia(scene) {
            const isSameBg = (scene.bgType === lastBgType && scene.bgValue === lastBgValue);

            if (!isSameBg) {
                if (scene.bgType === "video" && scene.bgValue) {
                    bgContainer.style.backgroundImage = "none";
                    bgContainer.style.background = "#000";
                    if (bgVideo.getAttribute("src") !== scene.bgValue) {
                        bgVideo.src = scene.bgValue;
                    }
                    bgVideo.style.display = "block";
                    bgVideo.play().catch(() => {});
                    restartPanAnimation();
                } else if (scene.bgType === "image" && scene.bgValue) {
                    bgVideo.style.display = "none";
                    bgVideo.pause();
                    bgContainer.style.background = "";
                    bgContainer.style.backgroundImage = `url('${scene.bgValue}')`;
                    restartPanAnimation();
                } else {
                    bgVideo.style.display = "none";
                    bgVideo.pause();
                    bgContainer.classList.remove("panning");
                    bgContainer.style.backgroundImage = "none";
                    bgContainer.style.background = scene.bgValue || "#0b0b0b";
                }

                lastBgType = scene.bgType;
                lastBgValue = scene.bgValue;
            }

            if (scene.bgm !== currentBgmSrc) {
                currentBgmSrc = scene.bgm;
                if (currentBgmSrc) {
                    bgmPlayer.src = currentBgmSrc;
                    bgmPlayer.volume = 1.0;
                    bgmPlayer.play().catch(() => {});
                } else {
                    bgmPlayer.pause();
                    bgmPlayer.removeAttribute("src");
                }
            } else if (currentBgmSrc) {
                ensureBgmPlaying();
            }
        }

        function loadDisplayPage(pageIndex, startAtFirstChunk = true) {
            if (pageIndex < 0 || pageIndex >= displayPages.length) return;
            currentDisplayPageIndex = pageIndex;

            const page = displayPages[currentDisplayPageIndex];
            const scene = SCENARIO[page.sceneIndex];

            visibleChunkCount = startAtFirstChunk ? 1 : page.chunks.length;

            renderCurrentChunks();
            applySceneMedia(scene);
            updateNavButtons();
        }

        function updateNavButtons() {
            const page = displayPages[currentDisplayPageIndex];
            const isAtVeryStart = (currentDisplayPageIndex === 0 && visibleChunkCount <= 1);
            const isAtVeryEnd = (currentDisplayPageIndex === displayPages.length - 1 && visibleChunkCount >= (page ? page.chunks.length : 1));

            prevBtn.disabled = isAtVeryStart;
            nextBtn.disabled = isTipsOpen() ? false : isAtVeryEnd;
        }

        function nextPage() {
            nudgeAddressBar();
            ensureBgmPlaying();

            if (isTipsOpen()) {
                closeTips();
                return;
            }

            const page = displayPages[currentDisplayPageIndex];
            if (!page) return;

            if (visibleChunkCount < page.chunks.length) {
                visibleChunkCount++;
                renderCurrentChunks();
                updateNavButtons();
            } else if (currentDisplayPageIndex < displayPages.length - 1) {
                loadDisplayPage(currentDisplayPageIndex + 1, true);
            }
        }

        function prevPage() {
            nudgeAddressBar();
            ensureBgmPlaying();

            if (isTipsOpen()) {
                closeTips();
                return;
            }

            if (currentDisplayPageIndex > 0) {
                loadDisplayPage(currentDisplayPageIndex - 1, true);
            } else if (visibleChunkCount > 1) {
                visibleChunkCount = 1;
                renderCurrentChunks();
                updateNavButtons();
            }
        }

        function formatQuotedTitle(rawTitle) {
            const trimmed = String(rawTitle || "").trim();
            if (!trimmed) return "";
            const hasLeading = trimmed.startsWith("「");
            const hasTrailing = trimmed.endsWith("」");
            if (hasLeading && hasTrailing) return trimmed;
            const inner = trimmed.replace(/^「|」$/g, "");
            return `「${inner}」`;
        }

        function openTips(word) {
            ensureBgmPlaying();
            const tip = TIPS_DICT[word];
            const titleEl = document.getElementById("tips-title");
            const bodyEl = document.getElementById("tips-body");

            if (tip) {
                titleEl.textContent = formatQuotedTitle(tip.title);
                bodyEl.textContent = tip.body;
            } else {
                titleEl.textContent = formatQuotedTitle(word);
                bodyEl.textContent = "（解説データ未登録）";
            }

            appEl.style.visibility = "hidden";
            tipsModalEl.style.display = "flex";
            tipsModalEl.scrollTop = 0;
            updateNavButtons();
        }

        function closeTips() {
            tipsModalEl.style.display = "none";
            appEl.style.visibility = "";
            updateNavButtons();
        }

        document.addEventListener("pointerdown", ensureBgmPlaying, { once: true });

        window.addEventListener("load", () => {
            nudgeAddressBar();
            rebuildDisplayPages(0);
            loadDisplayPage(0, true);
        });

        window.addEventListener("orientationchange", () => {
            setTimeout(() => {
                nudgeAddressBar();
                const currentSceneIdx = displayPages[currentDisplayPageIndex]?.sceneIndex ?? 0;
                rebuildDisplayPages(currentSceneIdx);
                loadDisplayPage(currentDisplayPageIndex, true);
            }, 250);
        });

        window.addEventListener("resize", () => {
            nudgeAddressBar();
            const currentSceneIdx = displayPages[currentDisplayPageIndex]?.sceneIndex ?? 0;
            rebuildDisplayPages(currentSceneIdx);
            loadDisplayPage(currentDisplayPageIndex, true);
        });

        rebuildDisplayPages(0);
        loadDisplayPage(0, true);
    </script>
</body>
</html>
